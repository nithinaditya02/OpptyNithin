<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<style>
body{
    margin: 0;
    padding: 40px;
    background-color: #f4f4f4;
    font-family: Arial, sans-serif;
}


h1{
    text-align: center;
    color: darkblue;
}

h1::before{
    content: "🔥 ";
}


h1::after{
    content: " 🔥";
}

.para::first-letter{
    font-size: 50px;
    color: red;
    font-weight: bold;
}


.para::first-line{
    color: blue;
    font-weight: bold;
}


::selection{
    background-color: yellow;
    color: red;
}


input{
    color: yellow;
    display: block;
    margin: auto;
    width: 300px;
    padding: 10px;
    font-size: 18px;
}


input::placeholder{
    color: green;
    font-style: italic;
}

</style>
<body>

    <h1>Pseudo Elements in CSS</h1>

    <p class="para">
        CSS Pseudo Elements are used to style specific parts of an element.
        They can style the first letter, first line, placeholder, selection,
        list markers, and also insert content before and after an element.
    </p>

    <br>

    <input type="text" placeholder="Enter your name">

    <br><br>


</body>
</html>
