<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Menu</title>

    <style>

        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            background: radial-gradient(circle at top left,
            #19f0a7 0%,
            #12d8c4 40%,
            #11c8f5 100%);
        }

        nav{
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            gap: 40px;
        }

        nav a{
            text-decoration: none;
            color: black;
            font-size: 22px;
            font-weight: 600;
        }

        .buttons{
            position: absolute;
            top: 20px;
            right: 40px;

            display: flex;
            gap: 15px;
        }

        .buttons button{
            padding: 10px 22px;
            border: none;
            border-radius: 30px;
            background-color: rgb(0, 0, 0);
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .burger{
            position: absolute;
            margin-top: -30px;
            margin-left: -20px;
        }

        .burger img{
            width: 350px;
            height: 220px;
        }

       

        .a{
            position: absolute;
            top: 220px;
            left: 70px;
            color: black;
        }

        .a h2{
            font-size: 25px;
            margin-bottom: 20px;
        }

        .a p{
            font-size: 15px;
            margin-bottom: 30px;
        }

        .order button{
            padding: 12px 28px;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .img{
            /* position: relative; */
            margin-top: 250px;
            margin-left: 750px;
            display: flex;
        }
        #all{
            display: flexg;
        }
        #b1{
            display: flex;
        }

    </style>
</head>

<body>
<div id="all">
    <div class="main">

        <div class="burger">
            <img src="../imports/coffe.png" alt="Coffee">
        </div>

        <nav>
            <a href="#home">Home</a>
            <a href="#services">Services</a>
            <a href="#menu">Menu</a>
            <a href="#food">Food</a>
            <a href="#contact">Contact</a>
        </nav>


        <div class="buttons">
            <button>Sign In</button>
            <button>Sign Up</button>
            <button>Login</button>
        </div>
</div>
<div id="b1">
        <div class="a">

            <h2>
                Discover Our Delectable <br>
                Delight's Menu
            </h2>

            <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit.
                <br>
                Dolorum vero ipsum ex mollitia iure in ipsa numquam
                eveniet qui.
            </p>

            <div class="order">
                <button>Order Now</button>
            </div>

        </div>

        <div class="img">
            <img src="https://media.istockphoto.com/id/1829241109/photo/enjoying-a-brunch-together.jpg?s=612x612&w=0&k=20&c=9awLLRMBLeiYsrXrkgzkoscVU_3RoVwl_HA-OT-srjQ=" alt="img" height="300px" width="400px"> 
        </div>

    </div>
</div>
</body>
</html>
