<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID card</title>
</head>
<style>
    body{
        background-color: #ffba26;
    }
    .a{
        border-radius: 50px;
        margin-left: 300px;
        margin-top: 130px;
        width: 700px;
        height: 400px;
        background-color: rgb(255, 255, 255);
        overflow: hidden;
        box-shadow: 0px 2px 14px 7px;
    }
    .aa{
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: aliceblue;
        border-radius:5% 5% 0% 0%;
        width: 700px;
        height: 80px;
        background-color: rgb(54, 53, 53);
    }
    .aa h2{
        font-size: xx-large;
        text-align: center;
    }
    .aa img{
        border-radius: 50%;
        margin-top: -150px;
        margin-left: 60px;
    }
    .b img{
        margin-left: 30px;
        margin-top:25px;
    }
    .c{
        margin-left: 300px;
        margin-top: -270px;
        display: flex;
    
    }
    .c6{
        margin-top: 200px;
        margin-left: 20px;
    }
    .f img{
        margin-top: -20px;
        margin-left: 260px;
    
    }
   
    input{
        border-top: none;
        border-right: none;
        border-left: none;
       display: flex;
    }


</style>
<body>
    <div class="a">
        <div class="aa">
            <h2>Oppty School</h2>
            <img src="https://media.licdn.com/dms/image/v2/D560BAQEEQ9x5qrrzgw/company-logo_200_200/B56ZgNSPwwHMAQ-/0/1752569544331?e=2147483647&v=beta&t=HvnhfPlMlNy1Spqd_ANzEMQIgokTfvwSeqSw63mY8g0" alt="" width="70px" height="70px">
        </div>

        <div class="b">
            <img src="https://png.pngtree.com/png-clipart/20220206/original/pngtree-men-cartoon-id-photo-png-image_7262523.png" alt="" width="200px" height="250px">
        </div>

        <div class="c">
            <form action="">

                <div class="c1">
                <label for="number">ID</label>
                <input type="number" name="number" id="number">
                </div>

                <div class="c2">
                    <label for="name">Name</label>
                    <input type="text" id="name" class="name">
                </div>

                <div class="c3">
                    <label for="team">Class</label>
                    <input type="text" id="team" class="team">
                </div>

                <div class="c4">
                    <label for="dob">D.O.B</label>
                    <input type="date" id="dob" class="dob">
                </div>

                <div>
                    <label for="address">Address</label>
                    <input type="text" id="address" class="address">
                </div>

                <div>
                    <label for="number">Phone</label>
                    <input type="number" id="number" class="number">
                </div>

                
            </form>
             <div class="c6">
                    <label for="sign">Principal</label>
                    <input type="text" id="sign" class="sign">
                </div>
        </div>

        <div class="f">
            <img src="https://png.pngtree.com/png-vector/20230526/ourmid/pngtree-isbn-barcodes-vector-png-image_7108020.png" alt="" width="200px" height="100px">
        </div>
    </div>
</body>
</html>
